name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_ci_pw
          POSTGRES_DB: erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://erp:erp_ci_pw@localhost:5432/erp?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_long_enough_123456
      JWT_REFRESH_SECRET: ci_refresh_secret_long_enough_123456
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: Admin#Ci12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @erp/shared-types --workspace @erp/accounting-engine
      - name: Prisma generate, migrate, seed
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://erp:erp_ci_pw@localhost:5432/shadow" --exit-code || true
          npm run prisma:seed
      - run: npm run typecheck
      - run: npm test
