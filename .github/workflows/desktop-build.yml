name: Build Desktop (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Every push builds the EXE and keeps it as a workflow artifact.
      # A GitHub Release (used by the auto-updater) is published only for version tags: git tag v0.1.0 && git push --tags
      - name: Build (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist -- --publish never
      - name: Build and publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERP-Desktop
          path: desktop/dist/*.exe
          if-no-files-found: error
