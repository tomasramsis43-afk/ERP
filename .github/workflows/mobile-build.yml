name: Build Mobile (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm   # the lockfile lives at the repository root (npm workspaces)
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace @erp/mobile
      - name: Unit tests
        run: npm test --workspace @erp/mobile

  apk:
    # Builds locally with Gradle, so no Expo token or EAS account is required.
    # Runs only on manual dispatch and publishes to the v0.1.0-mobile-apk release.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          if gh release view v0.1.0-mobile-apk >/dev/null 2>&1; then
            gh release upload v0.1.0-mobile-apk "$APK#ERP-Mobile.apk" --clobber
          else
            gh release create v0.1.0-mobile-apk "$APK#ERP-Mobile.apk" \
              --title "ERP Mobile (Representative) APK" \
              --notes "Installable Android APK built from main"
          fi
