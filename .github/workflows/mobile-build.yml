name: Build Mobile (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm   # the lockfile lives at the repository root (npm workspaces)
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace @erp/mobile
      - name: Unit tests
        run: npm test --workspace @erp/mobile

  apk:
    # The APK is built on Expo's servers; run it manually once EXPO_TOKEN is set (see docs).
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret (expo.dev > Access tokens) and run 'eas init' once so app.json gets extra.eas.projectId."
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build APK
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --non-interactive --no-wait
